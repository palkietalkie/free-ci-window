name: run-scheduled-workflows

# The one place the org's scheduled work starts. We do not pay GitHub for Actions, so once the free minutes run out or a charge goes unpaid, GitHub refuses every private run without starting it. So the private repos carry no `schedule:` at all: each hour this public repo, whose own Actions are free and always start, runs run_scheduled_workflows.py.
# Started by the Cloudflare Worker in hourly-clock/, never by a `schedule:` here: GitHub fired this repo's hourly cron only 2 to 5 times a day (palkietalkie/workspace#1462), and a second clock would dispatch the same hour twice.
on:
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    # Long enough for the slowest dispatched job; the window closes when they finish, not at this limit.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Open the window, dispatch what is due, close the window
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_PAT }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: python3 run_scheduled_workflows.py
